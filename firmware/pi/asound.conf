# C-kocka – ALSA-beállítás a Seeed ReSpeaker 2-Mics Pi HAT-hez (v1: WM8960 és v2.0: TLV320AIC3104 is)
# Az install.sh másolja ide: /etc/asound.conf
#
# - A hangkártyát a NEVÉRŐL keressük (seeed2micvoicec), nem a sorszámáról: a sorszám (HDMI, stb. mellett) változhat.
# - Lejátszás: dmix, hogy a beszéd, a hanghatás és a zene egyszerre is szólhasson (több aplay egy időben).
# - Felvétel: dsnoop, hogy az ébresztőszó-figyelő mellett más is olvashassa a mikrofont.
# - MONO: a kockában 1 hangszóró van. Minden hangot mindkét csatornára (L+R)/2 keverve küldünk, így mindegy,
#   hogy a JST hangszórókimenet melyik csatornát viszi (a v2.0 erősítője a két vonalkimenet összegét kapja, L+R).
# - 48 kHz-en fut mindkét kodek (a TLV320AIC3104 24,576 MHz-es órával, a WM8960 a saját PLL-jével); a "plug"
#   alakítja át a 16 kHz-es mikrofonfolyamot és a 22/24 kHz-es beszédet.

pcm.ckocka_hw_out {
    type dmix
    ipc_key 41991
    ipc_perm 0666
    slave {
        pcm "hw:CARD=seeed2micvoicec,DEV=0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 4096
    }
}

pcm.ckocka_hw_in {
    type dsnoop
    ipc_key 41992
    ipc_perm 0666
    slave {
        pcm "hw:CARD=seeed2micvoicec,DEV=0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 4096
    }
}

# mono: bármi jön (a plug előbb 2 csatornára alakítja), mindkét kimenetre ugyanaz a keverék megy
pcm.ckocka_mono {
    type route
    slave.pcm "ckocka_hw_out"
    slave.channels 2
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}

pcm.!default {
    type asym
    playback.pcm "plug:ckocka_mono"
    capture.pcm "plug:ckocka_hw_in"
}

ctl.!default {
    type hw
    card seeed2micvoicec
}
