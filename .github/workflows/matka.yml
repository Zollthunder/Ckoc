# Matka (sidekick/) elkészítése Windowsra és Macre, és feltöltése a GitHub Release-be.
# Indul: egy "matka-v…" tag feltöltésekor (pl. matka-v0.1.0), vagy kézzel az Actions fülön – ott egy meglévő kiadás
# tagjét megadva a hiányzó fájl (pl. a Mac-változat) utólag is felkerül a kiadáshoz.
name: Matka build

on:
  push:
    tags: ['matka-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Meglévő kiadás tagje (pl. matka-v0.1.1), amihez a fájlok felkerüljenek – üresen csak artifact lesz"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Mac: Intel-es gép, mert az Apple Silicon-os gépekre a GitHubon órákig kell várni (a build így is univerzális)
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sidekick
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Windows – hordozható exe
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --publish never

      # Mac: aláírás (99 $/év) nélkül. Univerzális app (Intel + Apple Silicon), helyi ("ad-hoc") aláírással,
      # különben Apple Silicon gépen el sem indulna. Utána egy .dmg, benne az Alkalmazások mappa linkje.
      - name: Mac – univerzális app és dmg
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dir --universal --publish never
          APP="release/mac-universal/Matka.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Matka -srcfolder dmg -ov -format UDZO release/Matka-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: matka-${{ runner.os }}
          path: |
            sidekick/release/Matka.exe
            sidekick/release/Matka-mac.dmg
          if-no-files-found: ignore

  # akkor is kiadja, ha az egyik rendszer nem készült el – ami megvan, az felkerül (a másik később pótolható)
  release:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Matka ${{ inputs.tag || github.ref_name }} – a C-kocka cicája az asztalodra
          body_path: sidekick/KIADAS.md
          files: out/*
          fail_on_unmatched_files: false
