<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-kocka STL előnézet</title>
<style>html,body{margin:0;height:100%;background:#16181c;overflow:hidden}canvas{display:block}#info{position:fixed;left:12px;top:10px;color:#ccc;font:13px system-ui}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="info">c-kocka.stl</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 10000);
const controls = new OrbitControls(camera, renderer.domElement);

new STLLoader().load('c-kocka.stl', geo => {
  geo.computeBoundingBox();
  const bb = geo.boundingBox, size = new THREE.Vector3(), c = new THREE.Vector3();
  bb.getSize(size); bb.getCenter(c);
  geo.translate(-c.x, -c.y, -c.z);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a8f99, roughness: 0.5, metalness: 0.1 }));
  // Fusion Z-fel -> three.js Y-fel
  window.setUp = zUp => { mesh.rotation.x = zUp ? -Math.PI / 2 : 0; };
  window.setUp(false); // a szkript Y-fel tájolásra forgatja a modellt
  scene.add(mesh);
  const d = Math.max(size.x, size.y, size.z);
  window.view = (x, y, z) => { camera.position.set(x * d, y * d, z * d); controls.target.set(0, 0, 0); controls.update(); };
  window.view(1.3, 1.0, 1.6);
  document.getElementById('info').textContent = `c-kocka.stl – méret: ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
});

(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
